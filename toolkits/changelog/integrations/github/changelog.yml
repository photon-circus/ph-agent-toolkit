name: changelog

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Synchronize locked tools
        run: uv sync --locked

      - name: Run current structure and policy checks
        run: uv run --locked ph-changelog --profile ph-eventing check CHANGELOG.md

      - name: Compare released history on ordinary pull requests
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        shell: bash
        env:
          CHANGELOG_BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${CHANGELOG_BASE_REF}:CHANGELOG.md" > "$RUNNER_TEMP/base-CHANGELOG.md"
          uv run --locked ph-changelog --profile ph-eventing check \
            CHANGELOG.md --base "$RUNNER_TEMP/base-CHANGELOG.md"
