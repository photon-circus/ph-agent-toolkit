[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ph-changelog-remote"
version = "0.1.0"
description = "Experimental source-only remote retrieval boundary sketch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = ["ph-changelog"]

[project.scripts]
ph-changelog-remote = "ph_changelog_remote.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_changelog_remote"]

[tool.uv.sources]
ph-changelog = { workspace = true }
