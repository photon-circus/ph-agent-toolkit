[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ph-changelog"
version = "0.1.0"
description = "Experimental source-only changelog boundary concepts and executable sketches"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = []

[project.scripts]
ph-changelog = "ph_changelog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_changelog"]
